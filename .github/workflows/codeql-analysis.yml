name: "CodeQL Analysis"

on:
  # Deliberately not on every push to master: the analysis is slow and its findings
  # are reviewed during a pull request, where they are still actionable. Keeping it
  # off master halves the runner minutes without losing coverage of new code.
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (C#)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: csharp
        # "default" rather than "security-extended": the extended suite adds web-oriented
        # queries (SQLi, XSS, template injection) that do not apply to a desktop app and
        # roughly 2.5x the runtime. The remaining security queries still cover the paths
        # that matter here — untrusted JSON parsing, path handling, process arguments.
        queries: default
        build-mode: none
        config: |
          paths-ignore:
            - '**/bin/**'
            - '**/obj/**'
            - '**/publish/**'
            - '**/TestResults/**'

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
