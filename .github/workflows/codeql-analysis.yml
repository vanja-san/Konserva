name: "CodeQL Analysis"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (C#)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5.4.0
      with:
        dotnet-version: '10.0.x'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: csharp
        queries: security-extended
        config: |
          paths-ignore:
            - '**/bin/**'
            - '**/obj/**'
            - '**/publish/**'
            - '**/TestResults/**'

    - name: Build
      run: |
        dotnet restore konserva-app/konserva-app.csproj
        dotnet build konserva-app/konserva-app.csproj --configuration Release --no-restore

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
