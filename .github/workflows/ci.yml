name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5.4.0
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore konserva-app/konserva-app.csproj --nologo

    - name: Restore test dependencies
      run: dotnet restore konserva-app.Tests/konserva-app.Tests.csproj --nologo

    - name: Build
      run: dotnet build konserva-app/konserva-app.csproj --nologo --no-restore

    - name: Build tests
      run: dotnet build konserva-app.Tests/konserva-app.Tests.csproj --nologo --no-restore

    - name: Run tests with coverage
      run: dotnet test konserva-app.Tests/konserva-app.Tests.csproj --nologo --no-restore --no-build --collect:"XPlat Code Coverage;Format=opencover" --results-directory TestResults/

    - name: Upload coverage report
      uses: actions/upload-artifact@v7.0.1
      if: always()
      with:
        name: coverage-report
        path: TestResults/**/coverage.opencover.xml
