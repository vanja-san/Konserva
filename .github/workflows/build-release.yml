name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.x.x (must match <Version> in konserva-app.csproj)'
        required: true
      create_release:
        description: 'Create GitHub Release after build'
        required: true
        type: boolean
        default: true
      generate_changelog:
        description: 'Generate changelog from commits since last tag'
        required: true
        type: boolean
        default: true

# Only 'contents: write' is used (manifest commit + release). issues/pull-requests
# were granted at workflow level without being needed by any step.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Fetch all history for changelog
        fetch-tags: true  # Explicitly fetch tags

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Generate Changelog
      id: changelog
      shell: pwsh
      run: |
        $outputFile = "CHANGELOG_RELEASE.md"
        $currentTag = "v${{ inputs.version }}"
        $repo = "${{ github.repository }}"

        # ── Найти предыдущий тег (новейший, не равный currentTag) ─────────────
        $allTags = @(git tag --sort=-version:refname)
        $previousTag = $null
        if ($allTags.Count -gt 0) {
          $prevCandidates = @($allTags | Where-Object { $_ -ne $currentTag })
          if ($prevCandidates.Count -gt 0) { $previousTag = $prevCandidates[0] }
        }

        # ── Собрать коммиты ───────────────────────────────────────────────────
        if ($previousTag) {
          Write-Host "Collecting commits: $previousTag..HEAD"
          $range = "$previousTag..HEAD"
          $commits = git log $range --pretty=format:"%h|%s" --no-merges
        } else {
          Write-Host "No previous tag — taking the last 30 commits"
          $commits = git log HEAD --pretty=format:"%h|%s" --no-merges -n 30
        }

        # ── Распарсить и разложить по категориям ─────────────────────────────
        $categories = [ordered]@{
          "🚀 Features"     = @()
          "🐛 Bug Fixes"    = @()
          "⚡ Performance"  = @()
          "🔨 Refactoring"  = @()
          "📚 Docs"         = @()
          "📝 Other"        = @()
        }

        if ($commits) {
          foreach ($line in $commits) {
            if (-not $line.Trim()) { continue }
            $parts = $line -split '\|', 2
            if ($parts.Length -lt 2) { continue }
            $hash = $parts[0]
            $msg  = $parts[1]

            $category = "📝 Other"
            $cleanMsg = $msg

            if     ($msg -match '^feat(\([^)]+\))?!?:\s*(.+)$')     { $category = "🚀 Features";    $cleanMsg = $Matches[2] }
            elseif ($msg -match '^fix(\([^)]+\))?!?:\s*(.+)$')      { $category = "🐛 Bug Fixes";   $cleanMsg = $Matches[2] }
            elseif ($msg -match '^perf(\([^)]+\))?!?:\s*(.+)$')     { $category = "⚡ Performance";  $cleanMsg = $Matches[2] }
            elseif ($msg -match '^refactor(\([^)]+\))?!?:\s*(.+)$') { $category = "🔨 Refactoring";  $cleanMsg = $Matches[2] }
            elseif ($msg -match '^docs(\([^)]+\))?!?:\s*(.+)$')     { $category = "📚 Docs";         $cleanMsg = $Matches[2] }
            elseif ($msg -match '^(chore|style|test|ci|build)(\([^)]+\))?!?:\s*(.+)$') {
              continue   # сервисные коммиты в changelog не попадают
            }

            $commitUrl = "https://github.com/$repo/commit/$hash"
            $categories[$category] += "- $cleanMsg ([$hash]($commitUrl))"
          }
        }

        # ── Собрать markdown ──────────────────────────────────────────────────
        $sb = [System.Text.StringBuilder]::new()

        [void]$sb.AppendLine("## 📝 What's Changed")
        [void]$sb.AppendLine()

        $hasChanges = $false
        foreach ($cat in $categories.Keys) {
          if ($categories[$cat].Count -eq 0) { continue }
          $hasChanges = $true
          [void]$sb.AppendLine("### $cat")
          [void]$sb.AppendLine()
          foreach ($item in $categories[$cat]) {
            [void]$sb.AppendLine($item)
          }
          [void]$sb.AppendLine()
        }

        if (-not $hasChanges) {
          [void]$sb.AppendLine("_No changes since the previous release._")
          [void]$sb.AppendLine()
        }

        # ── Блок скачивания ───────────────────────────────────────────────────
        [void]$sb.AppendLine("## 📦 Download Files")
        [void]$sb.AppendLine()
        [void]$sb.AppendLine("| Feature | Full (~60 MB) | Deps (~10 MB) |")
        [void]$sb.AppendLine("|---------|---------------|-------------|")
        [void]$sb.AppendLine("| .NET Runtime | ✅ Built-in | ⚠️ Required |")
        [void]$sb.AppendLine("| Size | ~60 MB | ~10 MB |")
        [void]$sb.AppendLine("| Setup | None | Install .NET 10 |")
        [void]$sb.AppendLine()
        [void]$sb.AppendLine("**Download .NET 10 Runtime:** https://dotnet.microsoft.com/download/dotnet/10.0")
        [void]$sb.AppendLine()

        # ── Full Changelog (в самом низу) ─────────────────────────────────────
        if ($previousTag) {
          [void]$sb.AppendLine("---")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("**📋 [Full Changelog](https://github.com/$repo/compare/${previousTag}...${currentTag})**")
          Write-Host "Full Changelog: $previousTag...$currentTag"
        } else {
          [void]$sb.AppendLine("---")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("**📋 [Full Changelog](https://github.com/$repo/commits/${currentTag})**")
          Write-Host "Full Changelog: initial release"
        }

        # ── Записать файл ─────────────────────────────────────────────────────
        [System.IO.File]::WriteAllText(
            (Join-Path $PWD $outputFile),
            $sb.ToString(),
            [System.Text.UTF8Encoding]::new($false))

        Write-Host "`n===== Generated changelog ====="
        Get-Content $outputFile -Raw
        exit 0

    - name: Restore dependencies
      run: dotnet restore konserva-app.slnx

    # Publishing a release whose tests never ran is how a broken build reaches users.
    # The test project lives outside konserva-app/, so restore/publish of the app alone
    # would not even compile it.
    - name: Run tests
      run: dotnet test konserva-app.Tests/konserva-app.Tests.csproj -c Release --no-restore

    - name: Build Full (Self-contained, ~60 MB)
      run: |
        dotnet publish konserva-app/konserva-app.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:EnableCompressionInSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:DebugType=none `
          -p:DebugSymbols=false `
          -o "publish/Full"
      shell: pwsh

    - name: Build Deps (~10 MB, requires .NET)
      run: |
        dotnet publish konserva-app/konserva-app.csproj `
          -c Release `
          /p:PublishProfile=Deps `
          -o "publish/Deps"
      shell: pwsh

    - name: Create Full archive (Self-contained, no dependencies)
      run: |
        $archiveName = "Konserva-v${{ inputs.version }}-Full.zip"
        Compress-Archive -Path "publish/Full/*" -DestinationPath $archiveName -Force
        Write-Host "Created: $archiveName"
        Get-Item $archiveName | Select-Object Name, Length
      shell: pwsh

    - name: Create Deps archive (Single file, requires .NET 10)
      run: |
        $archiveName = "Konserva-v${{ inputs.version }}-Deps.zip"
        Compress-Archive -Path "publish/Deps/*" -DestinationPath $archiveName -Force
        Write-Host "Created: $archiveName"
        Get-Item $archiveName | Select-Object Name, Length
      shell: pwsh

    - name: Update version manifest with real hashes
      # AppUpdater проверяет sha256 и sizeBytes из этого файла и отказывается
      # ставить обновление при несовпадении. Если манифест не обновить здесь,
      # он навсегда останется на предыдущем релизе, и пользователи либо не увидят
      # обновление, либо получат отказ по контрольной сумме.
      run: |
        $version = "${{ inputs.version }}"
        $fullName = "Konserva-v$version-Full.zip"
        $depsName = "Konserva-v$version-Deps.zip"
        $manifestPath = ".github/version.json"

        $full = Get-Item $fullName
        $deps = Get-Item $depsName
        $fullHash = (Get-FileHash $fullName -Algorithm SHA256).Hash.ToLowerInvariant()
        $depsHash = (Get-FileHash $depsName -Algorithm SHA256).Hash.ToLowerInvariant()

        $manifest = [ordered]@{
          latestVersion     = $version
          minRequiredVersion = "0.0.1"
          downloads         = [ordered]@{
            full  = [ordered]@{
              url       = "https://github.com/vanja-san/Konserva/releases/download/v$version/$fullName"
              sizeBytes  = $full.Length
              assetName  = $fullName
              sha256     = $fullHash
            }
            deps  = [ordered]@{
              url       = "https://github.com/vanja-san/Konserva/releases/download/v$version/$depsName"
              sizeBytes  = $deps.Length
              assetName  = $depsName
              sha256     = $depsHash
            }
          }
          releaseNotes  = ""
          changelogUrl  = "https://github.com/vanja-san/Konserva/releases/tag/v$version"
        }

        $json = $manifest | ConvertTo-Json -Depth 5
        [System.IO.File]::WriteAllText(
            (Join-Path $PWD $manifestPath),
            $json,
            [System.Text.UTF8Encoding]::new($false))
        Write-Host "Wrote $manifestPath for v$version"
        Write-Host "  $fullName  $($full.Length) bytes  $fullHash"
        Write-Host "  $depsName  $($deps.Length) bytes  $depsHash"
      shell: pwsh

    - name: Commit updated version manifest
      if: inputs.create_release == true
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add .github/version.json
        git diff --cached --quiet
        if ($LASTEXITCODE -eq 0) {
          Write-Host "version.json unchanged"
        } else {
          git commit -m "chore: update version manifest for v${{ inputs.version }}"
          git push
        }
      shell: pwsh

    - name: Upload Full artifact
      uses: actions/upload-artifact@v6
      with:
        name: Konserva-v${{ inputs.version }}-Full
        path: Konserva-v${{ inputs.version }}-Full.zip
        retention-days: 30

    - name: Upload Deps artifact
      uses: actions/upload-artifact@v6
      with:
        name: Konserva-v${{ inputs.version }}-Deps
        path: Konserva-v${{ inputs.version }}-Deps.zip
        retention-days: 30

    - name: Create GitHub Release
      if: inputs.create_release == true
      id: create_release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ inputs.version }}
        name: Konserva v${{ inputs.version }}
        body_path: CHANGELOG_RELEASE.md
        draft: false
        prerelease: false
        files: |
          Konserva-v${{ inputs.version }}-Full.zip
          Konserva-v${{ inputs.version }}-Deps.zip
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload build logs (on failure)
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: build-logs
        path: |
          konserva-app/bin/Release/
          konserva-app/obj/Release/
        retention-days: 7
        if-no-files-found: ignore
