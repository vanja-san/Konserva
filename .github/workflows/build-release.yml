name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.2.1)'
        required: true
        default: '1.2.1'
      create_release:
        description: 'Create GitHub Release after build'
        required: true
        type: boolean
        default: true
      generate_changelog:
        description: 'Generate changelog from commits since last tag'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for changelog
        fetch-tags: true  # Explicitly fetch tags

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Generate Changelog
      id: changelog
      shell: pwsh
      run: |
        $outputFile = "CHANGELOG_RELEASE.md"
        
        # Start changelog file
        $changelog = ""
        
        # Add full changelog link
        $changelog += "**📋 [FULL CHANGELOG](https://github.com/${{ github.repository }}/compare/v${{ inputs.version }})**`n`n"
        
        # Add file description section
        $changelog += "## 📦 Download Files`n`n"
        $changelog += "| Feature | Full (~60 MB) | Deps (~10 MB) |`n"
        $changelog += "|---------|---------------|-------------|`n"
        $changelog += "| .NET Runtime | ✅ Built-in | ⚠️ Required |`n"
        $changelog += "| Size | ~60 MB | ~10 MB |`n"
        $changelog += "| Setup | None | Install .NET 10 |`n"
        $changelog += "| Recommended for | Most users | Developers |`n`n"
        $changelog += "**Download .NET 10 Runtime:** https://dotnet.microsoft.com/download/dotnet/10.0`n"

        # Write changelog
        $changelog | Out-File -FilePath $outputFile -Encoding utf8

        Write-Host "Changelog generated successfully!"
        Get-Content $outputFile -Raw

    - name: Restore dependencies
      run: dotnet restore konserva-app/konserva-app.csproj

    - name: Build Full (Self-contained, ~60 MB)
      run: |
        dotnet publish konserva-app/konserva-app.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:EnableCompressionInSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:DebugType=none `
          -p:DebugSymbols=false `
          -o "publish/Full"
      shell: pwsh

    - name: Build Deps (~10 MB, requires .NET)
      run: |
        dotnet publish konserva-app/konserva-app.csproj `
          -c Release `
          /p:PublishProfile=Deps `
          -o "publish/Deps"
      shell: pwsh

    - name: Create Full archive (Self-contained, no dependencies)
      run: |
        $archiveName = "Konserva-v${{ inputs.version }}-Full.zip"
        Compress-Archive -Path "publish/Full/*" -DestinationPath $archiveName -Force
        Write-Host "Created: $archiveName"
        Get-Item $archiveName | Select-Object Name, Length
      shell: pwsh

    - name: Create Deps archive (Single file, requires .NET 10)
      run: |
        $archiveName = "Konserva-v${{ inputs.version }}-Deps.zip"
        Compress-Archive -Path "publish/Deps/*" -DestinationPath $archiveName -Force
        Write-Host "Created: $archiveName"
        Get-Item $archiveName | Select-Object Name, Length
      shell: pwsh

    - name: Upload Full artifact
      uses: actions/upload-artifact@v4
      with:
        name: Konserva-v${{ inputs.version }}-Full
        path: Konserva-v${{ inputs.version }}-Full.zip
        retention-days: 30

    - name: Upload Deps artifact
      uses: actions/upload-artifact@v4
      with:
        name: Konserva-v${{ inputs.version }}-Deps
        path: Konserva-v${{ inputs.version }}-Deps.zip
        retention-days: 30

    - name: Create GitHub Release
      if: inputs.create_release == true
      id: create_release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ inputs.version }}
        name: Konserva v${{ inputs.version }}
        body_path: CHANGELOG_RELEASE.md
        draft: false
        prerelease: false
        files: |
          Konserva-v${{ inputs.version }}-Full.zip
          Konserva-v${{ inputs.version }}-Deps.zip

    - name: Upload build logs (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          konserva-app/bin/Release/
          konserva-app/obj/Release/
        retention-days: 7
        if-no-files-found: ignore
